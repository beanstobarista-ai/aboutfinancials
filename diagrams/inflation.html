<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How inflation is measured</title>
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    main {
      width: min(1100px, calc(100vw - 96px));
      margin: 48px 0;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <main>
    <img src="inflation.svg" width="1100" height="680" alt="How inflation is measured. A fixed basket of bread, rent, fuel, and care: the list of things stays the same. Gray Then bars and taller blue Now bars: only the prices change. An upward arrow from that whole basket: that rise is inflation. One product going up is not inflation. A blank official number is not zero.">
  </main>
</body>
</html>
