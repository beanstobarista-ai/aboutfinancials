<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="inflation-title inflation-desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="inflation-title">How inflation is measured</title>
  <desc id="inflation-desc">How inflation is measured. A fixed basket holds bread, rent, fuel, and care, with the caption: the list of things stays the same. The same four things appear again as gray Then bars and taller blue Now bars, with the caption: only the prices change. An upward arrow rises from those four things, with the caption: that rise in the whole basket is inflation. Footer: one product going up is not inflation. A blank official number is not zero. No prices or percentages are shown.</desc>
  <defs>
    <filter id="panel-shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1d1d1f" flood-opacity="0.08"/>
    </filter>
    <symbol id="bread" viewBox="0 0 48 48">
      <path fill="currentColor" d="M5 31c.6-12 8.2-19 19-19s18.4 7 19 19v9.2c0 1.5-1.2 2.8-2.8 2.8H7.8c-1.6 0-2.8-1.3-2.8-2.8V31z"/>
      <path d="M14 28c6.2-4.2 13.6-4.2 20 0" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" fill="none"/>
    </symbol>
    <symbol id="rent" viewBox="0 0 48 48">
      <path fill="currentColor" d="M24 6 5.5 23h6.5v19h24V23h6.5L24 6z"/>
      <path fill="#ffffff" d="M21 29h6v13h-6z"/>
    </symbol>
    <symbol id="fuel" viewBox="0 0 48 48">
      <path fill="currentColor" d="M24 4.5C24 4.5 10 19 10 29.2 10 36.8 16.3 43 24 43s14-6.2 14-13.8C38 19 24 4.5 24 4.5z"/>
    </symbol>
    <symbol id="care" viewBox="0 0 48 48">
      <path fill="currentColor" d="M19.5 6h9a2 2 0 0 1 2 2v9.5H40a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H30.5V40a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2V30.5H8a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h9.5V8a2 2 0 0 1 2-2z"/>
    </symbol>
  </defs>

  <rect width="1100" height="680" fill="#f5f5f7"/>
  <rect x="28" y="24" width="1044" height="632" rx="28" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5" filter="url(#panel-shadow)"/>

  <text x="60" y="78" fill="#1d1d1f" font-size="28" font-weight="600" letter-spacing="-0.022em">How inflation is measured</text>

  <!-- Stage 1: fixed basket -->
  <path d="M138 168c0-46 124-46 124 0" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round"/>
  <path d="M108 172h184l-18 230q-2 22-22 22H148q-20 0-22-22Z" fill="#f5f5f7" stroke="#1d1d1f" stroke-width="1.75" stroke-linejoin="round"/>
  <g color="#1d1d1f">
    <use href="#bread" x="132" y="196" width="52" height="52"/>
    <use href="#rent" x="216" y="196" width="52" height="52"/>
    <use href="#fuel" x="132" y="300" width="52" height="52"/>
    <use href="#care" x="216" y="300" width="52" height="52"/>
  </g>
  <g fill="#6e6e73" font-size="14" font-weight="500" text-anchor="middle">
    <text x="158" y="266">Bread</text>
    <text x="242" y="266">Rent</text>
    <text x="158" y="370">Fuel</text>
    <text x="242" y="370">Care</text>
  </g>

  <g fill="none" stroke="#c7c7cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="312" y1="300" x2="368" y2="300"/>
    <polyline points="356,290 370,300 356,310"/>
  </g>

  <!-- Stage 2: same basket, twice. Gray Then bars, taller blue Now bars. No amounts. -->
  <text x="461" y="166" fill="#6e6e73" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="-0.011em">Then</text>
  <text x="657" y="166" fill="#0071e3" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="-0.011em">Now</text>

  <g color="#1d1d1f">
    <use href="#bread" x="379" y="180" width="26" height="26"/>
    <use href="#rent" x="425" y="180" width="26" height="26"/>
    <use href="#fuel" x="471" y="180" width="26" height="26"/>
    <use href="#care" x="517" y="180" width="26" height="26"/>
    <use href="#bread" x="575" y="180" width="26" height="26"/>
    <use href="#rent" x="621" y="180" width="26" height="26"/>
    <use href="#fuel" x="667" y="180" width="26" height="26"/>
    <use href="#care" x="713" y="180" width="26" height="26"/>
  </g>
  <g fill="#6e6e73" font-size="13" font-weight="500" text-anchor="middle">
    <text x="392" y="224">Bread</text>
    <text x="438" y="224">Rent</text>
    <text x="484" y="224">Fuel</text>
    <text x="530" y="224">Care</text>
    <text x="588" y="224">Bread</text>
    <text x="634" y="224">Rent</text>
    <text x="680" y="224">Fuel</text>
    <text x="726" y="224">Care</text>
  </g>

  <line x1="376" y1="424" x2="746" y2="424" stroke="#d2d2d7" stroke-width="1.5" stroke-linecap="round"/>

  <g fill="#aeaeb2">
    <rect x="384" y="350" width="16" height="74" rx="5"/>
    <rect x="430" y="316" width="16" height="108" rx="5"/>
    <rect x="476" y="366" width="16" height="58" rx="5"/>
    <rect x="522" y="332" width="16" height="92" rx="5"/>
  </g>
  <g fill="#0071e3">
    <rect x="580" y="288" width="16" height="136" rx="5"/>
    <rect x="626" y="244" width="16" height="180" rx="5"/>
    <rect x="672" y="312" width="16" height="112" rx="5"/>
    <rect x="718" y="268" width="16" height="156" rx="5"/>
  </g>

  <g fill="none" stroke="#c7c7cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="762" y1="300" x2="828" y2="300"/>
    <polyline points="816,290 830,300 816,310"/>
  </g>

  <!-- Stage 3: the whole basket costs more -->
  <text x="900" y="166" fill="#1d1d1f" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="-0.011em">Inflation</text>
  <path fill="#0071e3" d="M900 188l30 38h-16v140h-28V226h-16z"/>
  <g color="#1d1d1f">
    <use href="#bread" x="840" y="386" width="24" height="24"/>
    <use href="#rent" x="872" y="386" width="24" height="24"/>
    <use href="#fuel" x="904" y="386" width="24" height="24"/>
    <use href="#care" x="936" y="386" width="24" height="24"/>
  </g>
  <line x1="832" y1="424" x2="968" y2="424" stroke="#d2d2d7" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Captions under each stage -->
  <g fill="#1d1d1f" font-size="15" font-weight="500" text-anchor="middle">
    <text x="200" y="508">The list of things stays the same.</text>
    <text x="559" y="508">Only the prices change.</text>
    <text x="900" y="508">That rise in the whole basket is inflation.</text>
  </g>

  <line x1="60" y1="556" x2="1040" y2="556" stroke="#ececef" stroke-width="1"/>
  <text x="550" y="598" fill="#6e6e73" font-size="14" font-weight="400" text-anchor="middle">One product going up is not inflation. A blank official number is not zero.</text>
</svg>
